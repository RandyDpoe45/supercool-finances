# =============================================================================
# SuperCool Finances — Docker Compose spine (the macro artifact).
#
# This file is the spine of the whole system: every component plugs into it, and
# it GROWS ONE SERVICE PER STEP as the specs are built (see specs/README.md).
# It is NOT a final integration task — it exists from step 0 and accretes.
#
# Current state — Step 5 (spec 08, PUBLIC-PLANE FRONTENDS: client-app + otp-app,
#   served by public-nginx as the router; builds on spec 06's public edge):
#   - The five networks (§2) are declared. `data` carries the datastores; `keycloak`
#     also joins `app-public`, `app-internal` and `data` (spec 00 §2). `edge-public`
#     + `app-public` now have members (the public gateway/front door below);
#     `edge-internal` stays empty until the internal-edge half arrives (see below).
#     Isolation is by network MEMBERSHIP + not publishing ports — so these are
#     plain bridge networks (no `internal: true`).
#   - `keycloak` (spec 02): quay.io/keycloak/keycloak, pinned tag (NOT :latest — a
#     reproducible-from-zero boot needs a fixed digest; reasoned deviation from
#     spec 00's `keycloak:latest` baseline). Boots `start --import-realm`, importing
#     tools/keycloak/realm-export.json (mounted read-only) into the `supercool`
#     realm on first boot. Connects to the `keycloak` Postgres DB (spec 01) via
#     DISCRETE creds (KC_DB_URL_HOST/DATABASE + KC_DB_USERNAME/PASSWORD), never a
#     full JDBC URL var. Host-published on :8082 for the browser login redirect.
#     A network alias `keycloak.localtest.me` on app-public/app-internal makes
#     in-container services resolve that SAME name to this container, so the token
#     `issuer` (http://keycloak.localtest.me:8082/realms/supercool) is identical for
#     the browser and for containers (spec 02, the load-bearing detail).
#     See infra/keycloak/README.md.
#   - The three datastores are fully provisioned on `data` only, host-unpublished:
#       * postgres — two logical DBs (`balance`, `keycloak`) + two least-privilege
#         login roles, created by infra/postgres/init on first boot. CONNECT is
#         revoked from PUBLIC and granted only to each DB's owner, so the balance
#         role cannot reach `keycloak` and vice versa (database-per-service by
#         privilege, not convention).
#       * redis    — AUTH (requirepass, injected from env) + AOF persistence
#         (appendonly yes). redis-data is load-bearing: the outbox -> Stream
#         transport must survive a Redis restart.
#       * mongo    — auth on (root user) + an `analytics` DB whose app user has
#         readWrite on `analytics` only.
#     No connection-string vars are published: .env.example carries discrete
#     credentials + coordinates, and each service composes its own DSN at its
#     step (2-3). See spec 01 § Contracts.
#   - `balance-service` (spec 03, THIS step): the NestJS foundation SKELETON. It
#     validates its OWN env with zod (fail-fast), runs TypeORM migrations on boot
#     against the `balance` DB, binds the gateway + service-identity guards per
#     prefix (/api, /admin, /internal), returns the shared error DTO, and exposes
#     /internal/health (which backs the healthcheck below). It composes its OWN
#     Postgres DSN + Redis URL from the discrete creds mapped in via `environment:`
#     (no *_URL var — discrete-credentials contract, spec 01 § Contracts). Joins
#     app-public, app-internal, data (spec 00 §2); host-unpublished. The money
#     DOMAIN (ledger, transfers, OTP, relay) is added in spec 04.
#   - `analytics-server` (spec 03, THIS step): the NestJS foundation SKELETON. It
#     validates its OWN env with zod (fail-fast), connects to Mongo via mongoose
#     (no migrations — Mongo has none), binds the gateway (/admin) + service-identity
#     (/internal) guards per prefix — it has NO /api (customers never query it), so
#     no customer plane — returns the shared error DTO, and exposes /internal/health
#     (which backs the healthcheck below). It composes its OWN mongodb:// DSN from the
#     discrete creds mapped in via `environment:` (no *_URL var — discrete-credentials
#     contract, spec 01 § Contracts). Owns Mongo (ADR-11). Joins app-internal + data
#     ONLY (spec 00 §2 — NOT app-public: unreachable from the public plane at L3);
#     host-unpublished. The stream consumer + Mongo read model + reporting API are
#     added in spec 05.
#   - `client-app` + `otp-app` (spec 08, THIS step): the two PUBLIC SPAs, each a
#     PER-SPA ATOMIC image (developer ruling) — its own multi-stage Dockerfile
#     (node build -> nginx serving the bundle), build context scoped to its own
#     folder (web/client, web/otp — no cross-folder context, ADR-16). No build
#     args: a production `vite build` disables the MSW stub, the API base defaults
#     to the same-origin /balance/api, and the OIDC defaults already match the
#     compose issuer + realm clients. Both join `edge-public` ONLY and are
#     host-UNPUBLISHED — only public-nginx (:8080) is. public-nginx is now the
#     thin ROUTER that assembles them: `/` -> client-app, `/otp/` -> otp-app
#     (prefix preserved; that bundle is built for base '/otp/'), `/balance/api/`
#     -> public-kong (unchanged). See infra/nginx-public/nginx.conf + the two
#     web/*/docs. (The admin SPA + internal edge are a LATER pass — spec 08 scope
#     note; only :8080 + :8082 are published in this pass.)
#
# What arrives in later steps (do NOT add here early):
#   - Step 3  (spec 04): `balance-service`     — EXTENDED with the money domain
#                        (ledger, transfers, limits, OTP module, outbox relay).
#   - Step 3  (spec 05): `analytics-server`    — EXTENDED with the stream consumer,
#                        Mongo read model + reporting API (/admin) over it.
#   - Step 4  (spec 06, INTERNAL EDGE half — separate PR): the private plane.
#                        `internal-kong`       — joins edge-internal, app-internal.
#                        `internal-nginx`      — joins edge-internal (host-published :8081, demo-only).
#                        (The PUBLIC edge half — public-kong + public-nginx — is
#                         already wired below.)
#
# Startup order (spec 00 §5) is enforced as services arrive via
#   depends_on: { <dep>: { condition: service_healthy } }
# The datastores below already expose healthchecks so those conditions attach
# cleanly with no rework.
#
# Host ports are reserved as a macro contract in .env.example
#   (8080 public-nginx · 8081 internal-nginx · 8082 keycloak) and are wired up
#   in the steps noted above. Nothing is host-published at step 0.
#
# Config: copy .env.example -> .env before `docker compose up`. `.env` is
# git-ignored; real secrets live only in `.env` / Docker secrets, never committed.
# =============================================================================

networks:
  # Customer browser -> public front door.        Members arrive in step 4.
  edge-public:
    driver: bridge
  # Admin browser -> private internal front door.  Members arrive in step 4.
  edge-internal:
    driver: bridge
  # Public gateway -> services it may reach.        Members arrive in steps 2-4.
  app-public:
    driver: bridge
  # Internal gateway -> services it may reach.      Members arrive in steps 2-4.
  app-internal:
    driver: bridge
  # Services -> datastores. The only network with members at step 0.
  data:
    driver: bridge

volumes:
  pg-data:      # Postgres: ledger + outbox durability (source of truth).
  mongo-data:   # Mongo: analytics read-model persistence.
  redis-data:   # Redis: AOF persistence — load-bearing for the outbox -> Stream transport (spec 01).

services:
  # Source of truth: ledger + outbox (+ Keycloak DB). The init script under
  # infra/postgres/init runs once on first boot to create the `balance` and
  # `keycloak` databases, the two least-privilege login roles, and the
  # CONNECT-privilege isolation between them (see infra/postgres/README.md).
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Bootstrap superuser (init only); services connect as the least-priv roles.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Least-privilege login roles, consumed by the init script from the env.
      POSTGRES_BALANCE_USER: ${POSTGRES_BALANCE_USER}
      POSTGRES_BALANCE_PASSWORD: ${POSTGRES_BALANCE_PASSWORD}
      POSTGRES_KEYCLOAK_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_KEYCLOAK_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Config as code (spec 00 §4): init scripts mounted read-only, not baked in.
      # Runs only on an empty data dir (first boot); ignored on subsequent starts.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP probe: the initdb phase opens the Unix socket
      # before the server truly accepts connections, so a socket-only check can
      # flip healthy too early once depends_on: service_healthy is wired (step 2).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data

  # OTP codes + Redis Streams transport. AUTH on (requirepass) + AOF persistence.
  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      # redis-cli reads REDISCLI_AUTH automatically, so the healthcheck below
      # authenticates without ever putting the password on the command line
      # (a bare `redis-cli ping` would return NOAUTH and flap the container).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # AOF + dir come from the committed conf (non-secret); requirepass is injected
    # from the env here so the secret never lives in a committed file.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - data

  # Analytics read model (analytics-owned). Auth on (root user); the init script
  # under infra/mongo/init creates the `analytics` DB + an app user scoped to
  # readWrite on `analytics` only (see infra/mongo/README.md).
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      # Setting the root credentials turns on auth in the official image.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      # DB the init script runs against + the least-privilege app user it creates.
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_DB: ${MONGO_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      # Config as code: app-user provisioning, run once on an empty data dir.
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # ping is allowed pre-auth, so this stays valid with auth enabled.
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - data

  # Identity provider (spec 02). Boots in production mode with the `supercool`
  # realm imported from tools/keycloak/realm-export.json (mounted read-only), and
  # stores its state in the `keycloak` Postgres DB provisioned in step 1.
  #
  # Issuer resolution (the load-bearing detail, spec 02): KC_HOSTNAME fixes the
  # frontend URL to http://keycloak.localtest.me:8082, so every token's `issuer`
  # is http://keycloak.localtest.me:8082/realms/supercool. The browser reaches
  # that name via public DNS (*.localtest.me -> 127.0.0.1) and the published
  # 8082; in-container callers reach the SAME name via the compose network alias
  # below, so the issuer string is byte-identical on both sides. KC_HTTP_PORT is
  # set to 8082 so the port in the issuer matches from the browser AND containers.
  keycloak:
    # Pinned tag (NOT :latest): reproducible-from-zero requires a fixed image.
    # Reasoned deviation from spec 00's `keycloak:latest` baseline.
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      # --- DB: discrete creds pointing at the `keycloak` DB (spec 01). No full
      #     JDBC-URL var is introduced (project config preference / spec 02 #4).
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      # --- Hostname / issuer. Full URL form (KC 26 hostname v2) fixes scheme,
      #     host and port for both front- and back-channel, so the issuer is
      #     identical everywhere. TLS terminates at nginx later, so HTTP is
      #     enabled here and the internal HTTP port is 8082 to match the issuer.
      KC_HOSTNAME: http://${KC_HOSTNAME}:${KEYCLOAK_PORT}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: ${KEYCLOAK_PORT}
      # --- Health endpoints on the management port (9000) for the healthcheck.
      KC_HEALTH_ENABLED: "true"
      # --- Master-realm bootstrap admin (temporary admin account). Injected from
      #     .env, NEVER committed. Not part of the realm export.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      # Config as code (spec 00 §4): realm export mounted read-only into the
      # import dir; consumed once by `--import-realm` on first boot.
      - ./tools/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # The minimal image has no curl/wget, but /bin/sh is bash with /dev/tcp
      # support. Probe the readiness endpoint on the management port (9000) and
      # require the JSON status to be UP so the container only flips healthy once
      # the realm import + DB are actually ready (this gates balance-service in
      # step 3 via depends_on: service_healthy).
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      # Keycloak needs the `keycloak` DB + role (step 1) before it can migrate.
      postgres:
        condition: service_healthy
    networks:
      # `data` -> Postgres; `app-public`/`app-internal` -> reachable by both
      # gateways and both services (spec 00 §2). The alias makes containers on the
      # app-* nets resolve `keycloak.localtest.me` to this container, matching the
      # browser-facing issuer host.
      data:
      app-public:
        aliases:
          - ${KC_HOSTNAME}
      app-internal:
        aliases:
          - ${KC_HOSTNAME}
    ports:
      # Only host-published edge besides the nginx front doors (spec 00 §3):
      # the browser must reach Keycloak for the OIDC login redirect.
      - "${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"

  # Balance service — NestJS foundation skeleton (spec 03); the money domain is
  # added in spec 04. Reachable only via a Kong (app-public/app-internal) and its
  # datastores (data); NEVER host-published (spec 00 §2). The root DISCRETE creds
  # are mapped into the service's OWN env var names below (it is a self-contained
  # component — ADR-16 — and composes its own Postgres DSN + Redis URL internally;
  # no *_URL var, honoring the discrete-credentials contract, spec 01 § Contracts).
  balance-service:
    build: ./services/balance-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Postgres: the balance app role -> the `balance` DB (least-privilege, spec 01).
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_BALANCE_USER}
      DB_PASSWORD: ${POSTGRES_BALANCE_PASSWORD}
      # Redis: composed into a URL internally (used from spec 04 onward).
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Shared secret for the /internal service-identity guard.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      # Money-domain secrets (specs 04 step 4a / 5c) the env schema REQUIRES at
      # boot: OTP pepper (keyed HMAC for OTP codes at rest) + the external-rail
      # webhook HMAC signing secret. Distinct trust domains; both min 16 chars.
      OTP_HASH_SECRET: ${OTP_HASH_SECRET}
      RAILS_WEBHOOK_SIGNING_SECRET: ${RAILS_WEBHOOK_SIGNING_SECRET}
    healthcheck:
      # Node HTTP probe (alpine ships node): fails unless readiness is UP (the
      # endpoint returns 503 when Postgres is unreachable). GET /internal/health is
      # exempt from the service-identity guard so the probe needs no credentials.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/internal/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      # Startup chain (spec 00 §5): datastores + Keycloak healthy before the service
      # boots and runs its migrations.
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - app-public
      - app-internal
      - data

  # Analytics server — NestJS foundation skeleton (spec 03); the stream consumer +
  # Mongo read model + reporting API are added in spec 05. Reachable only via the
  # internal Kong (app-internal) and its datastore (data); it has NO /api and sits
  # on NO public network, so the public plane cannot reach it even at L3 (spec 00
  # §2). NEVER host-published. The root DISCRETE Mongo creds are mapped into the
  # service's OWN env var names below (it is a self-contained component — ADR-16 —
  # and composes its own mongodb:// DSN internally; no *_URL var, honoring the
  # discrete-credentials contract, spec 01 § Contracts).
  analytics-server:
    build: ./services/analytics-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Mongo: the least-privilege analytics app role -> the `analytics` DB (spec 01).
      # authSource is the `analytics` DB, where the app user is defined.
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB}
      MONGO_USER: ${MONGO_APP_USER}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_DB}
      # Redis: composed into a URL internally by the transaction-stream consumer.
      # Config is present from the read-model storage step (spec 05, A1) so the
      # service boots with the now-required vars; the consumer CLIENT + the `data`
      # network + depends_on: redis arrive with the A2 consumer.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Shared secret for the /internal service-identity guard.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    healthcheck:
      # Node HTTP probe (alpine ships node): fails unless readiness is UP (the
      # endpoint returns 503 when Mongo is unreachable). GET /internal/health is
      # exempt from the service-identity guard so the probe needs no credentials.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/internal/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      # Startup chain (spec 00 §5): datastore + Keycloak healthy before the service
      # boots. Mongo is its store; Keycloak gates the same chain as balance-service.
      mongo:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      # app-internal (reached by the internal Kong) + data (Mongo) ONLY — NOT
      # app-public, NOT edge-* (spec 00 §2). Host-unpublished.
      - app-internal
      - data

  # Public API gateway (spec 06, public edge) — the PEP for the customer plane.
  # Stock modern Kong 3.x (pinned), DB-LESS from the committed declarative kong.yml
  # (config as code, spec 00 §4). The allowlist in that file IS the exposed surface
  # (ADR-12): only the SERVICE-NAMESPACED /balance/api -> balance-service (ADR-17:
  # Kong strips /balance so the upstream still gets /api), default-deny everything
  # else (bare /api, /balance/admin, /admin all 404 — admin off this plane). On that
  # route a `pre-function` (serverless-functions) OWNS the security-critical
  # auth (developer ruling): it STRIPS any client-supplied identity headers,
  # verifies the token against Keycloak's JWKS (RS256 signature + iss + aud + exp +
  # realm role `customer`) using vetted crypto (Kong's core jwt_parser +
  # lua-resty-openssl), and INJECTS the trusted X-User-Id (sub) / X-Roles — the
  # exact contract the balance service's gateway guard consumes. Fails closed. All
  # required libs ship in the image, so no custom build is needed. Joins edge-public
  # (<- public-nginx) + app-public (-> balance-service + keycloak alias); NEVER
  # host-published (only public-nginx is). See infra/kong-public/README.md.
  public-kong:
    # Pinned tag (NOT :latest) — reproducible-from-zero, same rationale as the
    # other image pins.
    image: kong:3.9.0
    restart: unless-stopped
    environment:
      # DB-less: no Postgres; the declarative config is the whole data plane.
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      # Only the bundled plugins are used (pre-function, cors, rate-limiting).
      KONG_PLUGINS: bundled
      # The pre-function `require`s Kong core + crypto modules; the declarative Lua
      # is OURS (committed + reviewed), so it runs trusted, not sandboxed.
      KONG_UNTRUSTED_LUA: "on"
      # HTTP-only on localhost (spec 06, TLS resolved as plain HTTP): bind just the
      # plaintext proxy on :8000 — no :8443 ssl listener, no cert needed.
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      # DB-less needs no runtime Admin API; keep it off (nothing to administer,
      # smaller attack surface). The healthcheck below uses the `kong` CLI, not it.
      KONG_ADMIN_LISTEN: "off"
    volumes:
      # Declarative config mounted read-only (config as code). The auth logic lives
      # inside it (the pre-function); no image build required.
      - ./infra/kong-public/kong.yml:/kong/kong.yml:ro
    healthcheck:
      # `kong health` checks the local node's processes (no Admin API required).
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      # Startup chain (spec 00 §5): the upstream it fronts + the IdP it validates
      # tokens against must be healthy before the gateway accepts traffic.
      balance-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - edge-public
      - app-public

  # Customer SPA (spec 08) — a PER-SPA ATOMIC image (developer ruling): built AND
  # served by its own multi-stage Dockerfile (node build -> nginx serving the
  # bundle), build context scoped to web/client ONLY (no cross-folder context,
  # ADR-16). No build args — a production `vite build` disables the MSW stub and
  # the API/OIDC defaults already match the compose topology. Joins edge-public
  # ONLY and is host-UNPUBLISHED: it is reachable solely via public-nginx, which
  # routes `/` here. See web/client/docs.
  client-app:
    build: ./web/client
    restart: unless-stopped
    healthcheck:
      # busybox wget (ships in the nginx:alpine base) against the served SPA root:
      # proves the built bundle is actually served (index.html -> 200), not just
      # that nginx is up. Local probe — does not traverse the router.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      # The public front door reaches it here; it touches no other network and is
      # never host-published (spec 08 §Ports & origin).
      - edge-public

  # OTP out-of-band SPA (spec 08) — same PER-SPA ATOMIC shape as client-app, build
  # context scoped to web/otp ONLY. The bundle is built for base '/otp/', so its
  # assets + OIDC redirect live under /otp/; public-nginx routes /otp/* here with
  # the prefix PRESERVED and the container serves the bundle from …/html/otp/.
  # Joins edge-public ONLY and is host-UNPUBLISHED. See web/otp/docs.
  otp-app:
    build: ./web/otp
    restart: unless-stopped
    healthcheck:
      # Probe the served SPA under its /otp/ base (the app is not at the root here):
      # /otp/ -> /otp/index.html -> 200, proving the bundle is served.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/otp/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - edge-public

  # Public front door (spec 06 edge + spec 08 router) — the ONLY host-published
  # surface of the public plane. As of spec 08 it is the thin ROUTER that assembles
  # the per-SPA atomic images (it holds NO bundles itself): /balance/api/* ->
  # public-kong (ADR-17: Kong strips /balance so balance-service gets /api/*),
  # /otp/* -> otp-app (prefix preserved), and the / catch-all -> client-app. Stock
  # nginx image with a read-only mounted conf (config as code); no custom image
  # needed. Plain HTTP on localhost — TLS is NOT terminated here for this demo
  # (spec 06, open question resolved). Joins edge-public ONLY (it reaches the
  # gateway + the two SPA images over that network, never a service directly).
  # See infra/nginx-public/README.md.
  public-nginx:
    # Pinned tag (NOT :latest) — reproducible-from-zero, same rationale as the
    # other image pins.
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx-public/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # busybox wget (ships in the alpine image) against the nginx-local /healthz.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      # Every upstream it fronts must be healthy first, else that route 502s: the
      # gateway (/balance/api) and both SPA images (/, /otp/).
      public-kong:
        condition: service_healthy
      client-app:
        condition: service_healthy
      otp-app:
        condition: service_healthy
    networks:
      - edge-public
    ports:
      # The public HTTP edge (macro host-port contract, .env.example): 8080 -> 80.
      - "${PUBLIC_HTTP_PORT}:80"
