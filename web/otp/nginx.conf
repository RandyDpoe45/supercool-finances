# =============================================================================
# otp-app — the SPA image's OWN nginx server (baked into this image).
#
# NOT the public-nginx router (infra/nginx-public/nginx.conf, mounted read-only):
# this config belongs to THIS atomic image and only serves its own bundle. It is
# copied over the stock image's /etc/nginx/conf.d/default.conf and inherits the
# base image's http{} block (mime types, etc.).
#
# The bundle is built for base '/otp/' (assets + OIDC redirect live under /otp/),
# and public-nginx forwards /otp/* here WITHOUT stripping the prefix. The built
# files live under …/html/otp/, so the URL path maps 1:1 onto the filesystem via a
# plain `root`. Deep links under /otp/ fall back to the SPA shell at
# /otp/index.html so react-router owns in-app navigation.
# =============================================================================
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # /otp/ + everything beneath it. Real files (…/otp/assets/*) are served
    # directly (…/otp/ is a directory, not a file, so it skips to the fallback);
    # any other /otp/ path returns the SPA shell for client-side routing.
    location /otp/ {
        try_files $uri /otp/index.html;
    }
}
