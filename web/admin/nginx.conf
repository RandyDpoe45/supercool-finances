# =============================================================================
# admin-app — the SPA image's OWN nginx server (baked into this image).
#
# NOT the internal-nginx router (infra/nginx-internal/nginx.conf, mounted
# read-only): this config belongs to THIS atomic image and only serves its own
# bundle. It is copied over the stock image's /etc/nginx/conf.d/default.conf and
# inherits the base image's http{} block (mime types, etc.). The router forwards
# `/` here; this server returns the static assets and falls back to the SPA shell
# for client-side (deep-link) routes so react-router owns in-app navigation.
# =============================================================================
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: real files (…/assets/*, …/mockServiceWorker.js) are
    # served directly; any other path returns index.html so a deep link / reload
    # lands on the SPA shell rather than a 404.
    location / {
        try_files $uri /index.html;
    }
}
