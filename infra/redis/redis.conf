# redis.conf — non-secret Redis configuration (config as code, spec 00 §4).
#
# The AUTH password is NEVER written here: it is injected at runtime via
# `--requirepass` on the compose command line, substituted from ${REDIS_PASSWORD}
# in the git-ignored .env. This file carries only the persistence settings.
#
# AOF persistence is load-bearing (spec 01 "Resolved"): the outbox -> Redis Stream
# relay marks an outbox row published right after XADD, so a wiped stream would
# drop in-flight events the relay never re-publishes, breaking "never lost".
appendonly yes
appendfsync everysec
dir /data
