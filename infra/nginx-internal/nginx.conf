# =============================================================================
# internal-nginx — the admin-facing front door (spec 06, internal edge).
#
# The host-published surface of the INTERNAL plane (:8081 -> :80, demo-only
# exposure). It does two jobs:
#   1. Reverse-proxy the service-namespaced admin paths -> internal-kong:
#        /balance/admin/*   -> balance-service admin surface
#        /analytics/admin/* -> analytics-server admin surface
#      (ADR-17: Kong strips `/<service>` so each upstream gets `/admin/...`).
#   2. Serve the admin SPA bundle at / — DEFERRED to spec 08 (build-and-serve);
#      until then the web root is a commented placeholder.
#
# TLS is NOT terminated here: this demo runs plain HTTP on localhost (spec 06,
# resolved). In a real deployment TLS terminates at this hop; nothing downstream
# changes. Publishing :8081 to the host is a DEMO convenience — the internal plane
# would not be host-exposed in production.
# =============================================================================
user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  _;

        # Docker's embedded DNS. Paired with the variable upstream below, nginx
        # resolves `internal-kong` at REQUEST time (not once at startup), so a Kong
        # restart / new container IP is picked up without restarting nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # nginx liveness only (NOT an API): lets compose/other tooling probe that
        # the front door is up without traversing the gateway.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # --- Admin APIs: reverse-proxy the SERVICE-NAMESPACED paths to the gateway.
        # The upstream host is a variable (+ resolver above) so it is resolved per
        # request; $request_uri forwards the original path+query verbatim, so e.g.
        # /balance/admin/whoami reaches Kong intact (Kong then strips `/balance` and
        # delivers /admin/... to balance-service). Kong enforces admin-auth / roles /
        # rate-limit and injects X-User-Id / X-Roles; nginx adds no identity.
        location /balance/admin/ {
            set $kong_upstream internal-kong;
            proxy_pass http://$kong_upstream:8000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /analytics/admin/ {
            set $kong_upstream internal-kong;
            proxy_pass http://$kong_upstream:8000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- SPA bundle (admin-app): served in spec 08; nothing here yet. -------
        location / {
            # PLACEHOLDER — spec 08 wires the built admin SPA here, e.g.:
            #   root      /usr/share/nginx/html;
            #   try_files $uri /index.html;   # SPA history-fallback
            return 404;
        }
    }
}
