# =============================================================================
# internal-nginx — the admin-facing front door (spec 06 edge + spec 08 router).
#
# The host-published surface of the INTERNAL plane (:8081 -> :80, demo-only
# exposure). As of spec 08 it is the thin ROUTER that ASSEMBLES the per-SPA
# atomic admin image (it holds NO bundle itself; the admin-app image serves its
# own). It does two jobs:
#   1. Reverse-proxy the service-namespaced admin paths -> internal-kong:
#        /balance/admin/*   -> balance-service admin surface
#        /analytics/admin/* -> analytics-server admin surface
#      (ADR-17: Kong strips `/<service>` so each upstream gets `/admin/...`).
#   2. Serve the admin SPA at / — the catch-all now proxies to the `admin-app`
#      image (built for base '/', root-served); that image owns its own
#      `try_files … /index.html` history fallback. (No longer the placeholder
#      404: the admin SPA is served here as of the spec 08 admin step.)
#
# TLS is NOT terminated here: this demo runs plain HTTP on localhost (spec 06,
# resolved). In a real deployment TLS terminates at this hop; nothing downstream
# changes. Publishing :8081 to the host is a DEMO convenience — the internal plane
# would not be host-exposed in production.
# =============================================================================
user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  _;

        # Docker's embedded DNS. Paired with the variable upstream below, nginx
        # resolves `internal-kong` at REQUEST time (not once at startup), so a Kong
        # restart / new container IP is picked up without restarting nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # nginx liveness only (NOT an API): lets compose/other tooling probe that
        # the front door is up without traversing the gateway.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # --- Admin APIs: reverse-proxy the SERVICE-NAMESPACED paths to the gateway.
        # The upstream host is a variable (+ resolver above) so it is resolved per
        # request; $request_uri forwards the original path+query verbatim, so e.g.
        # /balance/admin/whoami reaches Kong intact (Kong then strips `/balance` and
        # delivers /admin/... to balance-service). Kong enforces admin-auth / roles /
        # rate-limit and injects X-User-Id / X-Roles; nginx adds no identity.
        location /balance/admin/ {
            set $kong_upstream internal-kong;
            proxy_pass http://$kong_upstream:8000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /analytics/admin/ {
            set $kong_upstream internal-kong;
            proxy_pass http://$kong_upstream:8000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Admin SPA: catch-all (LAST) -> the admin-app image. Its bundle is
        # built for base '/', so it serves the origin root and owns its own
        # history fallback. Same per-request DNS pattern (variable upstream +
        # resolver above) as the admin API routes, so admin-app is resolved per
        # request (a container restart / new IP is picked up without restarting
        # nginx); $request_uri forwards the original path+query verbatim.
        location / {
            set $admin_upstream admin-app;
            proxy_pass http://$admin_upstream:80$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
