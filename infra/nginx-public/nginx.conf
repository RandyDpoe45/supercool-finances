# =============================================================================
# public-nginx — the customer-facing front door (spec 06 edge + spec 08 router).
#
# The ONLY host-published surface of the public plane (:8080 -> :80). It is the
# thin ROUTER that ASSEMBLES the per-SPA atomic images (developer ruling, spec 08)
# — it holds NO bundles itself; each SPA image serves its own. Three jobs, matched
# by nginx longest-prefix (so /balance/api/ and /otp/ win over the / catch-all):
#   1. /balance/api/* -> public-kong (the gateway that authenticates and injects
#      the trusted identity). The path is service-namespaced (ADR-17): Kong strips
#      `/balance` so balance-service still gets its built `/api/...` surface
#      (external probe: GET /balance/api/whoami -> upstream /api/whoami).
#   2. /otp/*          -> the otp-app image, prefix PRESERVED (NOT stripped): that
#      bundle is built for base '/otp/', so its assets + OIDC redirect live under
#      /otp/ and the container serves them from …/html/otp/ (spec 08).
#   3. /               -> the client-app image (catch-all, last). Its bundle is
#      built for base '/', served at the origin root.
# Each SPA image owns its own `try_files … /index.html` history fallback; this
# router does not; it forwards the original URI verbatim ($request_uri).
#
# TLS is deliberately NOT terminated here: this demo runs plain HTTP on localhost
# (spec 06 open question, resolved). In a real deployment TLS terminates at this
# hop; nothing downstream changes.
# =============================================================================
user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  _;

        # Docker's embedded DNS. Paired with the variable upstream below, nginx
        # resolves `public-kong` at REQUEST time (not once at startup), so a Kong
        # restart / new container IP is picked up without restarting nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # nginx liveness only (NOT an API): lets compose/other tooling probe that
        # the front door is up without traversing the gateway.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # --- Public API: reverse-proxy the SERVICE-NAMESPACED path to the gateway.
        # The upstream host is a variable (+ resolver above) so it is resolved per
        # request; $request_uri forwards the original path+query verbatim, so
        # …/balance/api/whoami reaches Kong intact (Kong then strips `/balance` and
        # delivers /api/... to balance-service). Kong enforces auth/roles/rate-limit
        # and injects X-User-Id / X-Roles; nginx adds no identity of its own.
        location /balance/api/ {
            set $kong_upstream public-kong;
            proxy_pass http://$kong_upstream:8000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- OTP SPA: reverse-proxy /otp/* to the otp-app image, PREFIX PRESERVED.
        # Same variable-upstream + resolver pattern as /balance/api/ above, so
        # otp-app is resolved per request (a container restart / new IP is picked
        # up without restarting nginx). $request_uri forwards the original path
        # verbatim, so `/otp/` is NOT stripped — the otp bundle (base '/otp/')
        # loads its assets and OIDC redirect from under /otp/, and the otp-app
        # container owns the /otp/ history fallback.
        location /otp/ {
            set $otp_upstream otp-app;
            proxy_pass http://$otp_upstream:80$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Client SPA: catch-all (LAST) -> the client-app image. Its bundle is
        # built for base '/', so it serves the origin root and owns its own
        # history fallback. Same per-request DNS pattern as the routes above.
        location / {
            set $client_upstream client-app;
            proxy_pass http://$client_upstream:80$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
