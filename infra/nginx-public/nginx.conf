# =============================================================================
# public-nginx — the customer-facing front door (spec 06, public edge).
#
# The ONLY host-published surface of the public plane (:8080 -> :80). It does two
# jobs:
#   1. Reverse-proxy /api/* -> public-kong (the gateway that authenticates and
#      injects the trusted identity). The /api prefix is PRESERVED end to end —
#      the balance service routes on it (probe: GET /api/whoami).
#   2. Serve the customer + OTP SPA bundles at / — DEFERRED to spec 08
#      (build-and-serve). Until then the web root is a commented placeholder.
#
# TLS is deliberately NOT terminated here: this demo runs plain HTTP on localhost
# (spec 06 open question, resolved). In a real deployment TLS terminates at this
# hop; nothing downstream changes.
# =============================================================================
user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  _;

        # Docker's embedded DNS. Paired with the variable upstream below, nginx
        # resolves `public-kong` at REQUEST time (not once at startup), so a Kong
        # restart / new container IP is picked up without restarting nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # nginx liveness only (NOT an API): lets compose/other tooling probe that
        # the front door is up without traversing the gateway.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # --- Public API: reverse-proxy to the gateway, PRESERVING /api ---------
        # The upstream host is a variable (+ resolver above) so it is resolved per
        # request; $request_uri forwards the original path+query verbatim, so
        # …/api/whoami stays …/api/whoami. Kong enforces auth/roles/rate-limit and
        # injects X-User-Id / X-Roles; nginx adds no identity of its own.
        location /api/ {
            set $kong_upstream public-kong;
            proxy_pass http://$kong_upstream:8000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- SPA bundles: served in spec 08; nothing here yet (default-deny). ---
        location / {
            # PLACEHOLDER — spec 08 wires the built client + OTP SPAs here, e.g.:
            #   root      /usr/share/nginx/html;
            #   try_files $uri /index.html;   # SPA history-fallback
            return 404;
        }
    }
}
