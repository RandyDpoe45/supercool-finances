# Analytics Server — Schema Manifest (Mongo read model)
#
# Handoff artifact for the implementor building spec 05's persistence layer.
# Derived from specs/DATA-MODEL.md (Part 2); that doc + spec 05 remain the
# contract of record. This file lists WHAT to persist; the implementor decides
# the Mongo driver / ODM mapping.
#
# Shape of this read model (decided):
#   - ONE stored collection: `transactions` (below). It is the authoritative,
#     flattened, append-only projection of the transaction event stream.
#   - ALL dashboard figures are QUERY-TIME aggregation pipelines over it. There are
#     NO materialized rollups — so nothing to keep consistent, idempotent by
#     construction, maximum dashboard flexibility. The two query-time views
#     (accountSummaries, dailyAggregates) are documented at the bottom as reference;
#     they are NOT stored collections.
#   - Analytics OWNS Mongo and never touches Postgres. The stored document is
#     therefore fully self-contained (denormalized) — no cross-store joins.
#   - Money is `long` (int64) MINOR UNITS, carried verbatim from the ledger. Never float.
#   - Time is UTC (Mongo Date = UTC; ISO-8601 `Z` from the event); clients localize to Mexico City time.
#   - The consumed event contract is the INPUT (documented at the bottom); it is
#     duplicated producer/consumer and kept in sync via the spec (ADR-16), not shared.

Transactions:
  description: "The analytics read model's single stored collection — a flattened, append-only projection of transaction events consumed from the Redis stream `events:transactions`. ONE document PER EVENT (a posting and its later reversal are two documents = a faithful money history). Deduped by `_id = event_id`, so at-least-once redelivery yields exactly one document (spec 05 DoD). Self-contained / denormalized: no relations, no joins back to Postgres. Every dashboard figure is a query-time aggregation over this collection. Collection: transactions."
  attributes:
    _id:
      type: "string (uuid)"
      description: "The event_id (= outbox_event.id from the balance service). Unique by construction; it is the idempotent UPSERT key that makes at-least-once stream redelivery safe. The consumer's ONLY write is this upsert, then XACK."
    transactionId:
      type: "string (uuid)"
      description: "The source transaction id. Indexed { transactionId: 1 }. Multiple events (posted, then reversed) can share it."
    eventType:
      type: string
      description: "'transaction.posted' | 'transaction.reversed' | 'transaction.failed'."
    type:
      type: string
      description: "internal | external_outbound | external_inbound. Indexed { type: 1, occurredAt: -1 } for per-type time series."
    status:
      type: string
      description: "POSTED | REVERSED | FAILED — the transaction's status at the moment of this event."
    amount:
      type: "long (int64)"
      description: "Positive magnitude, MINOR UNITS. Carried verbatim from the ledger (never re-derived, never floated)."
    currency:
      type: string
      description: "ISO currency code."
    initiatedBy:
      type: string
      description: "Keycloak `sub` (customer) or admin `sub` that initiated the transaction."
    reversesTransactionId:
      type: "string (uuid) | null"
      description: "For a reversal event, the transaction it compensates; null otherwise."
    failureReason:
      type: "string | null"
      description: "The domain error code on a transaction.failed (e.g. INSUFFICIENT_FUNDS, ACCOUNT_FROZEN, LIMIT_EXCEEDED); null otherwise (e.g. on a transaction.posted). Carried on the event header for per-reason failure analytics."
    payee:
      type: "object | null"
      description: "External beneficiary for external_outbound; null otherwise. Sub-fields: id (string uuid), displayName (string), rail (string)."
    legs:
      type: "array<object>"
      description: "The double-entry legs; SUM(delta) = 0, so analytics can re-assert the invariant on read. Each leg: accountId (string uuid), ownerId (string|null — customer sub, null for system/clearing), accountKind ('customer'|'system'), systemKey (string|null, e.g. 'clearing:rail-outbound'), delta (long, signed minor units), balanceAfter (long, minor units), currency (string). Multikey index { 'legs.accountId': 1 } for per-account grouping."
    owners:
      type: "array<string>"
      description: "Distinct customer ownerIds across the legs — a filter/index helper for per-customer history and aggregation. Compound index { owners: 1, occurredAt: -1 }."
    occurredAt:
      type: date
      description: "Event time (from the event's occurred_at). Index { occurredAt: -1 } for time series and recent-first history."
  relations: {}
  # No relations by design: the document is denormalized and self-contained so the
  # read side never joins (and cannot reach Postgres). Everything a query needs is
  # embedded (owners, legs.ownerId, amounts, balances).
  #
  # Full index set on `transactions`:
  #   - unique { _id }                         (event dedup — the exactly-once gate)
  #   - { transactionId: 1 }
  #   - { occurredAt: -1 }                      (time series / recent)
  #   - { owners: 1, occurredAt: -1 }           (per-customer history)
  #   - { type: 1, occurredAt: -1 }             (per-type series)
  #   - { 'legs.accountId': 1 }                 (multikey — per-account $group)

# ---------------------------------------------------------------------------
# CONSUMED EVENT CONTRACT (input — NOT persisted as-is; projected into a
# `transactions` document by the consumer). Contract of record: DATA-MODEL Part 2.
# Duplicated producer (balance service) / consumer (here), kept in sync via the spec.
#
# The WIRE is camelCase (verified against the producer/relay). The three STREAM
# fields (event_id, event_type, payload) sit OUTSIDE the payload; `payload` is the
# JSON object below. Money is int64 MINOR UNITS carried as a STRING (parsed to a
# bigint/Long on projection). A reversal is LINK-ONLY: a compensating
# transaction.posted with reversesTransactionId — there is NO transaction.reversed.
#
#   -- stream fields --
#   event_id       string(uuid)   = outbox_event.id; becomes _id (dedup key)
#   event_type     string         transaction.posted | transaction.failed
#   payload        JSON string    the object below
#   -- payload (camelCase) --
#   schemaVersion  int            bump on any contract change (consumer branches on it)
#   occurredAt     ISO-8601       -> occurredAt
#   transaction:
#     id                       string(uuid)
#     type                     internal | external_outbound | external_inbound
#     status                   POSTED (posted event) | FAILED (failed event)
#     amount                   int64 STRING (minor units)
#     currency                 string
#     initiatedBy              string (sub)
#     reversesTransactionId    string(uuid) | null
#     payee                    { id, displayName, rail } | null   (external_outbound only)
#     createdAt                ISO-8601
#     postedAt                 ISO-8601 | null   (null on transaction.failed)
#     failureReason            string | null     (domain error code on transaction.failed; null on posted)
#   legs[]:                    (SUM(delta) == 0; EMPTY on transaction.failed)
#     accountId      string(uuid)
#     ownerId        string | null        (customer sub; null for system/clearing)
#     accountKind    customer | system
#     systemKey      string | null        (e.g. clearing:rail-outbound)
#     delta          int64 STRING (signed minor units)
#     balanceAfter   int64 STRING (minor units)
#     currency       string
#
# Consumer flow: XREADGROUP -> project -> upsert transactions by _id=event_id -> XACK
# (write-then-ack). Idle un-acked entries recovered with XAUTOCLAIM (restart re-processes
# only un-acked, no loss/no dupes). Standalone Mongo is sufficient (single idempotent
# write; no multi-document transaction needed).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# QUERY-TIME VIEWS (output — NOT stored collections; aggregation pipelines over
# `transactions`, optionally exposed as MongoDB views via db.createView). Exact
# fields firm up with the admin screens (spec 07); shapes below are a v1.
#
# accountSummaries  ($group on legs.account_id):
#   accountId, ownerId, accountKind, systemKey, currency,
#   lastBalanceAfter ($last balanceAfter by occurredAt), txnCount,
#   totalDebited, totalCredited, lastActivityAt
#
# dailyAggregates   ($group on date x currency x type):
#   date, currency, type, count, totalAmount (minor units)
# ---------------------------------------------------------------------------
